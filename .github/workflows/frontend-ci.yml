name: E-farm frontend CI

on:
  push:
    branches:
      - feature/documentos-pdf-efarm-integrados
      - main
  pull_request:
    branches:
      - main
      - feature/redisenio-erp-efarm

jobs:
  verificar-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar codigo
        run: npm run lint
      - name: Ejecutar pruebas de documentos
        run: node --test src/utils/documentosComerciales.test.js src/utils/documentosFormales.test.js
      - name: Compilar frontend
        run: npm run build
